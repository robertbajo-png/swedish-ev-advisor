name: Publish Pages preview

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Verify SeekEV]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: seekev-pages-preview
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  eligibility:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && vars.PREVIEW_DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Require green CI before the credentialled job starts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pages_preview.mjs ci

  preview:
    needs: eligibility
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      SITE_URL: https://seekev.se
      VITE_SITE_URL: https://seekev.se
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_ANON_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Verify exact commit, CI and preview target
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/pages_preview.mjs check
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - run: bun run verify:pages-preview
      - run: bun run verify:advisor-data
      - run: bun run verify:cloudflare
      - run: bun run seo:build
      - run: bun run verify:seo
      - name: Upload to preview branch only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler@4.151.1 pages deploy dist --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch=codex-ui-preview --commit-hash="$DEPLOY_SHA" --commit-dirty=false
      - name: Resolve exact successful preview
        id: deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/pages_preview.mjs resolve
      - name: Check public pages, API health and noindex
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.url }}
        shell: bash
        run: |
          mkdir -p data/local
          node scripts/verify_deployment.mjs "$PREVIEW_URL" --expect-preview | tee data/local/preview-check.json
          printf '### UI preview\n\n[%s](%s)\n\nCommit: `%s`\n\nCanonical snapshot; no live LLM readiness claimed.\n' "$PREVIEW_URL" "$PREVIEW_URL" "$DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve public verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-preview-verification
          path: data/local/preview-check.json
