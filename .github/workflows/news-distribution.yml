name: Distribute published EV news

on:
  workflow_dispatch:
    inputs:
      redistribute_snapshot_sha256:
        description: 'Manual replay only: exact SHA-256 of the unchanged published snapshot'
        required: false
        type: string
        default: ''
  schedule:
    - cron: '17 1-23/4 * * *'
  workflow_run:
    workflows: [Automated EV news]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: seekev-ai-preview-news-distribution
  cancel-in-progress: false

env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  eligibility:
    if: >-
      vars.NEWS_DISTRIBUTION_ENABLED == 'true' &&
      ((github.event_name != 'workflow_run' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require green CI and the current main commit before credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/news_distribution.mjs ci

  distribute:
    needs: eligibility
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 20
    env:
      SITE_URL: https://elbilsagenten.se
      VITE_SITE_URL: https://elbilsagenten.se
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_ANON_KEY: ''
      NEWS_BUILD_SYNC: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read only published news with the public database key
        id: snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEWS_REDISTRIBUTE_HASH: ${{ inputs.redistribute_snapshot_sha256 || '' }}
        run: node scripts/sync_news_snapshot.mjs --write
      - name: Verify an unchanged preview instead of silently assuming healthy HTML
        if: steps.snapshot.outputs.upload_required == 'false'
        env:
          PREVIEW_URL: https://codex-ai-preview.seekev-ai-preview.pages.dev
        run: node scripts/news_distribution.mjs verify
      - uses: oven-sh/setup-bun@v2
        if: steps.snapshot.outputs.upload_required == 'true'
        with:
          bun-version: latest
      - uses: actions/setup-python@v5
        if: steps.snapshot.outputs.upload_required == 'true'
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
        if: steps.snapshot.outputs.upload_required == 'true'
      - run: bun run verify:news-distribution
        if: steps.snapshot.outputs.upload_required == 'true'
      - run: bun run verify:news-distribution-workflow
        if: steps.snapshot.outputs.upload_required == 'true'
      - name: Build article HTML and sitemap for the authorized snapshot
        if: steps.snapshot.outputs.upload_required == 'true'
        run: bun run seo:build
      - name: Verify built routes
        if: steps.snapshot.outputs.upload_required == 'true'
        run: bun run verify:seo
      - name: Require the same public snapshot immediately before upload
        if: steps.snapshot.outputs.upload_required == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/sync_news_snapshot.mjs --expect-hash=${{ steps.snapshot.outputs.snapshot_hash }}
      - name: Recheck current CI and the existing AI preview target
        if: steps.snapshot.outputs.upload_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/news_distribution.mjs check
      - name: Upload to the existing AI preview only
        if: steps.snapshot.outputs.upload_required == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEWS_SNAPSHOT_HASH: ${{ steps.snapshot.outputs.snapshot_hash }}
        run: bunx wrangler@4.151.1 pages deploy dist --project-name=seekev-ai-preview --branch=codex-ai-preview --commit-hash="$DEPLOY_SHA" --commit-dirty=false --commit-message="news-snapshot:${NEWS_SNAPSHOT_HASH}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
      - name: Resolve this exact snapshot and workflow attempt
        id: deployment
        if: steps.snapshot.outputs.upload_required == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEWS_SNAPSHOT_HASH: ${{ steps.snapshot.outputs.snapshot_hash }}
        run: node scripts/news_distribution.mjs resolve
      - name: Verify deployed snapshot, article HTML, sitemap and noindex
        if: steps.snapshot.outputs.upload_required == 'true'
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.url }}
        run: node scripts/news_distribution.mjs verify
      - name: Preserve the public snapshot for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-public-news
          path: public/data/news_articles.json
