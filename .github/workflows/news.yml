name: Automated EV news

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seekev-news-production
  cancel-in-progress: false

jobs:
  news:
    if: ${{ vars.NEWS_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NEWS_OPENAI_MODEL: ${{ vars.NEWS_OPENAI_MODEL || 'gpt-5.4-mini' }}
      SITE_URL: https://seekev.se
      NEWS_BACKEND: supabase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify news contracts
        run: python -m unittest discover -s tests -p test_news.py -v
      - name: Verify production configuration and migration
        run: python scripts/news_preflight.py --remote
      - name: Collect, verify and publish
        run: python scripts/news_engine.py run --backend supabase --max-items 8 --max-stories 3
      - name: Verify official car sources flagged by news
        run: python scripts/news_verification_worker.py --backend supabase --limit 3
      - name: Preserve run diagnostics and validated export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-public-export
          path: public/data/news_articles.json
      - name: Trigger static SEO rebuild when configured
        env:
          NEWS_DEPLOY_HOOK: ${{ secrets.NEWS_DEPLOY_HOOK }}
        if: success()
        run: |
          if [ -n "$NEWS_DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error -X POST "$NEWS_DEPLOY_HOOK"
          fi
