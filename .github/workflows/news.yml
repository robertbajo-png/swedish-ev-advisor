name: Automated EV news

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: seekev-news-production
  cancel-in-progress: false

jobs:
  eligible:
    if: github.ref == 'refs/heads/main' && vars.NEWS_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require exact current-main CI before editorial credentials
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
        run: node scripts/news_distribution.mjs ci
  news:
    if: github.ref == 'refs/heads/main' && vars.NEWS_AUTOMATION_ENABLED == 'true'
    needs: eligible
    environment: production-news
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NEWS_OPENAI_MODEL: ${{ vars.NEWS_OPENAI_MODEL || 'gpt-6-sol' }}
      SITE_URL: https://elbilsagenten.se
      NEWS_BACKEND: supabase
      NEWS_SOURCE_PROFILE: broad
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify news contracts
        run: python -m unittest discover -s tests -p 'test_news*.py' -v
      - name: Collect broad international discovery without AI or publication
        run: python scripts/news_engine.py collect --backend supabase --max-items 3 --publisher-lookback 20
      - name: Verify owner activation, pricing and settled accounting
        run: python scripts/news_preflight.py --remote --mode publish
      - name: Run owner-activated short news (two audited AI formats, price notice proof, one-per-day setting)
        if: ${{ vars.NEWS_SHORT_ARTICLES_ENABLED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_short_news.py run | tee news-run-result.json
          python -c 'import json; r=json.load(open("news-run-result.json")); print("News outcome:",r.get("status","published" if r.get("published")==1 else "unknown")); assert r.get("published")==1 or r.get("status") in ("daily_limit","daily_attempt_limit","no_eligible_new_source","deferred_budget_or_disabled"), "Editorial run held; inspect diagnostic, do not retry paid calls"'
      - name: Run independently proven CarNewsChina and The Driven adapters
        if: ${{ vars.NEWS_PUBLISHER_ARTICLES_ENABLED == 'true' }}
        env:
          NEWS_PUBLISHER_ARTICLES_ENABLED: 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_publisher_news.py run | tee publisher-run-result.json
          python -c 'import json; r=json.load(open("publisher-run-result.json")); print("Publisher outcome:",r["status"]); assert r.get("published")==1 or r["status"] in ("daily_limit","daily_attempt_limit","already_reported","no_eligible_new_source","deferred_budget","deferred_budget_or_disabled","awaiting_source_qualification"), "Publisher editorial check held; no automatic paid retry"'
      - name: Qualify new publisher sources privately without retrying rejected stories
        if: ${{ vars.NEWS_PUBLISHER_QUALIFICATION_ENABLED == 'true' }}
        env:
          NEWS_PUBLISHER_QUALIFICATION_ENABLED: 'true'
        run: python scripts/run_publisher_news.py qualify
      - name: Preserve run diagnostics and validated export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-public-export
          path: public/data/news_articles.json
      # Owner switches and shared allowances remain enforced by the database.
      # Production distribution is a separate public-read-only workflow.
