name: Automated EV news

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seekev-news-production
  cancel-in-progress: false

jobs:
  news:
    if: ${{ vars.NEWS_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NEWS_OPENAI_MODEL: ${{ vars.NEWS_OPENAI_MODEL || 'gpt-6-sol' }}
      SITE_URL: https://elbilsagenten.se
      NEWS_BACKEND: supabase
      NEWS_SOURCE_PROFILE: official
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify news contracts
        run: python -m unittest discover -s tests -p 'test_news*.py' -v
      - name: Verify collection infrastructure
        run: python scripts/news_preflight.py --remote --mode collect
      - name: Collect even when the paid allowance is paused or exhausted
        run: python scripts/news_engine.py collect --backend supabase
      - name: Stage factual notices only (no paid AI or publishing)
        run: python scripts/news_engine.py notices --backend supabase --max-items 8 --stage-only
      - name: Run owner-activated short news (two audited AI formats, price notice proof, one-per-day setting)
        if: ${{ vars.NEWS_SHORT_ARTICLES_ENABLED == 'true' }}
        run: python scripts/run_short_news.py run
      - name: Preserve run diagnostics and validated export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-public-export
          path: public/data/news_articles.json
      # Default remains private/free. The short worker cannot activate owner switches.
      # Deployment of a changed export remains a separate existing hosting step.
