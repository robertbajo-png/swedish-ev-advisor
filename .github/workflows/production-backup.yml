name: Production encrypted backup

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: elbilsagenten-production-backup
  cancel-in-progress: false

jobs:
  eligible:
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require exact successful main CI before reading any backup credential
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/production_operations_ci.mjs
  backup:
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_BACKUP_ENABLED == 'true'
    needs: eligible
    environment: production-operations
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install trusted backup clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age curl ca-certificates gpg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          gpg --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc | awk -F: '$1 == "fpr" {print $10; exit}' | grep -Fx B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
      - name: Create encrypted read-only backup
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: PATH="/usr/lib/postgresql/17/bin:$PATH" python scripts/production_backup.py
      - name: Upload encrypted archive only
        uses: actions/upload-artifact@v4
        with:
          name: production-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: backup-output/database.tar.gz.age
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/setup-node@v4
        if: failure()
        with:
          node-version: '24'
      - name: Alert if backup failed
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/production_monitor.mjs --backup-failed
