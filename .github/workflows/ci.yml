name: Verify SeekEV

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://elbilsagenten.se
      VITE_SITE_URL: https://elbilsagenten.se
      VITE_OPERATOR_NAME: Boleo AI
      VITE_CONTACT_EMAIL: kontakt@boleoai.se
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: bun run verify:db-security
      - run: bun run verify:db-access
      - run: bun run verify:advisor
      - run: bun run verify:advisor-data
      - run: bun run verify:catalog
      - run: bun run verify:catalog-migration
      - run: bun run verify:image-sync
      - run: bun run verify:kia-price-sync
      - run: bun run verify:current-variants
      - run: bun run verify:variant-refresh
      - run: bun run verify:price-refresh
      - run: bun run verify:price-evidence
      - run: bun run verify:dev-file-boundary
      - run: bun run verify:toyota-publication
      - run: bun run verify:cloudflare
      - run: bun run verify:live-ai
      - run: bun run verify:ai-budget
      - run: bun run verify:advisor-matching
      - run: bun run verify:ai-cost
      - run: bun run verify:tco
      - run: bun run verify:news-presentation
      - run: bun run verify:news-release
      - run: bun run verify:news-package
      - run: bun run verify:news-distribution
      - run: bun run verify:news-distribution-workflow
      - run: bun run verify:release-config
      - run: bun run verify:release-runtime
      - run: bun run verify:qa-browser
      - run: bun run verify:release-build
      - run: bun run verify:deployment-contract
      - run: bun run verify:pages-preview
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun run verify:site-info
      - run: python -m unittest discover -s tests -p test_image_rights.py -v
      - run: bun run verify:licensed-images
      - run: bun run verify:kia-prices
      - run: bun run verify:current-intake
      - run: bun run verify:vehicle-redirects
      - run: bun run verify:images
      - run: python scripts/audit_image_rights.py --check
      - run: python -m unittest discover -s tests -p test_skoda_price_intake.py -v
      - run: bun run verify:price-refresh-worker
      - run: python -m unittest discover -s tests -p test_news.py -v
      - run: bun run verify:news-smoke
      - run: bun run verify:news-pressrooms
      - run: bun run verify:news-source-check
      - run: python -m unittest discover -s tests -p 'test_news_bmw*.py' -v
      - run: python -m unittest discover -s tests -p 'test_news_short*.py' -v
      - run: bun run verify:news-editorial-release
      - run: bun run verify:news-preflight
      - run: bun run verify:news-trial
      - run: bun run verify:news-review-trial
      - run: bun run verify:news-context
      - run: bun run verify:news-writing
      - run: bun run verify:news-claim-scope
      - run: bun run verify:news-fact-plan
      - run: bun run verify:news-comparisons
      - run: bun run verify:news-fact-brief
      - run: bun run verify:news-matrix
      - run: bun run verify:news-statistics
      - run: bun run verify:news-calibration
      - run: bun run verify:news-length
      - run: bun run verify:news-evidence-windows
      - run: bun run verify:news-equipment
      - run: bun run verify:news-launch-wording
      - run: bun run verify:news-writing-trial-r24
      - run: bun run verify:news-power-terminology
      - run: bun run verify:news-breadth-r25
      - run: bun run verify:news-ab-trial
      - run: bun run verify:news-ab-budget
      - run: bun run verify:news-luna-trial
      - run: bun run verify:news-luna-budget
      - run: bun run verify:news-notices
      - run: bun run verify:news-notice-publication
      - run: bun run verify:news-notice-sql
      - run: bun run verify:news-notice-preflight
      - run: bun run verify:news-hybrid-launch
      - run: bun run verify:news-model
      - run: bun run verify:news-sol-budget
      - run: bun run verify:news-sol-test
      - run: bun run verify:news-sol-trial
      - run: bun run verify:news-audit-contract
      - run: bun run verify:news-collection-safety
      - run: bun run verify:news-verification-handoff
      - run: bun run verify:news-owner-exception
      - run: bun run verify:news-test-allowance
      - run: bun run verify:news-originality
      - run: bun run verify:env-loading
      - run: bun run verify:catalog-audit
      - run: bun run verify:variant-refresh-extraction
      - run: python -m pip install pypdf==6.10.0
      - run: bun run verify:toyota-intake
      - run: bun run verify:toyota-publication-worker
      - run: bun run verify:toyota-grade-discovery
      - run: bun run verify:toyota-configurator
      - run: npx --yes wrangler@latest pages functions build functions --outdir=/tmp/seekev-functions-build
      - run: bun run seo:build
      - run: bun run verify:seo
      - name: Install browser for UI checks
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
            echo "PLAYWRIGHT_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            bunx playwright install --with-deps chromium
          fi
      - name: Verify accessibility and UI regressions
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 5174 --strictPort > /tmp/seekev-ui-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:5174/ > /dev/null; then break; fi
            sleep 1
          done
          bun run verify:site-qa
          bun run verify:ui-proportions
          bun run verify:home-ui
          bun run verify:vehicle-ui
          bun run verify:vehicle-redirects-ui
          bun run verify:price-evidence-ui
          bun run verify:journal-ui
          bun run verify:news-ui
      - name: Preserve UI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-qa-fixtures
          path: |
            data/local/design-qa/
            data/local/ui-proportions/
            data/local/news-qa/
